[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-mcp-server"
version = "0.1.0"
description = "MCP server for the COMPASS (Bespoke Metrics) subcontractor prequalification API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
compass-mcp = "compass_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
